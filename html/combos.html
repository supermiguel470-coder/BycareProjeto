<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByCare</title>
    <link rel="stylesheet" href="../css/combos.css">
    <link rel="stylesheet" href="../css/carrinho.css">
</head>
<body>
    <div id="app">
    <header class="cabecalho">
        <nav>
            <img class="logo" src="../img/LogoBycare.png" alt="Logo da Bycare">

        <div class="botoes">
            <a href="index.html">
                <button class="button">Início</button>
            </a>

            <a href="combos.html">
                <button class="button">Combos</button>
            </a>

            <a href="categorias.html">
                <button class="button">Categorias</button>
            </a>

            <a href="#contato">
                <button class="button">Contatos</button>
            </a>

            <carrinho-painel></carrinho-painel>
        </div>
        </nav>
    </header>

    <main>
        <h2>Principais combos</h2>
        <ul class="lista-produtos">
            <li v-for="c in combos" :key="c.id">
                <div class="produto">
                    <img :src="imagem(c.imagem)" :alt="c.nome">
                    <h3>{{ c.nome }}</h3>
                    <p>{{ c.descricao }}</p>
                    <p>{{ preco(c.preco) }}</p>
                    <button class="btn-comprar" :class="{ adicionado: adicionado(c.id) }" @click="adicionar(c)">{{ adicionado(c.id) ? 'Adicionado ✓' : 'Adicionar ao carrinho' }}</button>
                </div>
            </li>
        </ul>
    </main>

    <footer class="rodape">
        <div id="endereco">
            <p>Av. Engenheiro Luís Carlos Berrini, 1120 - Itaim Bibi</p>
        </div>
        <div id="contato">
            <h3>Contato</h3>
            <a>bycareofc@hotmail.com</a>
        </div>

        <div id="miniTexto">
            <p>Bycare — beleza e cuidado para a sua rotina.</p>
        </div>
    </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
    <script src="../js/dados.js"></script>
    <script src="../js/carrinho.js"></script>
    <script src="../js/combos.js"></script>
</body>
</html>
